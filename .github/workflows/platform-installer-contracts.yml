name: Platform installer contracts (synthetic only)

on:
  pull_request:
    paths:
      - '.github/workflows/platform-installer-contracts.yml'
      - 'docs/platform-installer-ci.md'
      - 'packaging/platform-installers/**'
      - 'scripts/install-macos.sh'
      - 'scripts/install-windows.ps1'
      - 'tests/platform-installers/**'
  push:
    paths:
      - '.github/workflows/platform-installer-contracts.yml'
      - 'docs/platform-installer-ci.md'
      - 'packaging/platform-installers/**'
      - 'scripts/install-macos.sh'
      - 'scripts/install-windows.ps1'
      - 'tests/platform-installers/**'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  contracts:
    name: Synthetic contracts / ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10
    strategy:
      fail-fast: false
      max-parallel: 1
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    env:
      PYTHONDONTWRITEBYTECODE: '1'
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set up Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.12'
          check-latest: false
      - name: Compile Python in memory (no source pycache)
        shell: python {0}
        run: |
          from pathlib import Path
          for name in ('packaging/platform-installers/install.py',
                       'tests/platform-installers/test_contract.py'):
              compile(Path(name).read_bytes(), name, 'exec')
      - name: Parse macOS Bash entry point (Linux and macOS)
        if: runner.os != 'Windows'
        shell: bash
        run: bash -n scripts/install-macos.sh
      - name: Parse Windows PowerShell entry point (never execute)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $tokens = $null
          $parseErrors = $null
          $entry = Join-Path $env:GITHUB_WORKSPACE 'scripts/install-windows.ps1'
          $null = [System.Management.Automation.Language.Parser]::ParseFile(
            $entry, [ref]$tokens, [ref]$parseErrors)
          if ($parseErrors.Count -gt 0) {
            $parseErrors | ForEach-Object { Write-Error $_.ToString() }
            exit 1
          }
      - name: Run unchanged synthetic contracts in isolated temporary storage
        shell: python {0}
        run: |
          import os
          from pathlib import Path
          import tempfile
          import unittest

          # macOS /var can be a symlink; safe() intentionally rejects it.
          # Resolve only the fixture base, never weaken installer validation.
          base = Path(os.environ['RUNNER_TEMP']).resolve(strict=True)
          with tempfile.TemporaryDirectory(prefix='lain-contracts-', dir=base) as isolated:
              tempfile.tempdir = str(Path(isolated).resolve(strict=True))
              # Windows must support real symlinks; no skip or privilege escalation.
              probe = Path(tempfile.tempdir)
              (probe / 'target').write_text('synthetic')
              (probe / 'link').symlink_to(probe / 'target')
              (probe / 'link').unlink()
              (probe / 'target').unlink()
              suite = unittest.defaultTestLoader.discover(
                  'tests/platform-installers', pattern='test_contract.py')
              result = unittest.TextTestRunner(verbosity=2).run(suite)
              if not result.wasSuccessful() or result.testsRun == 0 or result.skipped:
                  raise SystemExit(1)
      - name: Verify checkout remains unchanged
        shell: python {0}
        run: |
          import subprocess
          status = subprocess.check_output(
              ['git', 'status', '--porcelain', '--untracked-files=all'], text=True)
          if status.strip():
              raise SystemExit('Contract verification changed the checkout:\n' + status)
